<!DOCTYPE html>
<html>
<head>
    <title>Monochromatic Fractal Meditation</title>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
        }
        canvas {
            display: block;
            max-width: 1200px;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            cursor: none;
        }
    </style>

<base target="_self">

<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
</head>
<body>
    <canvas id="gl-canvas"></canvas>

    <script>
        const canvas = document.getElementById('gl-canvas');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            document.body.innerHTML = '<h1>Error</h1><p>WebGL 2.0 is not supported by your browser. Please use a modern browser like Chrome or Firefox.</p>';
            throw new Error('WebGL 2.0 not supported');
        }

        const vertexShaderSource = `#version 300 es
        in vec2 aPosition;
        void main() {
            gl_Position = vec4(aPosition, 0.0, 1.0);
        }`;

        const fragmentShaderSource = `#version 300 es
        precision highp float;

        out vec4 fragColor;

        uniform vec2 iResolution;
        uniform float iTime;
        uniform vec4 iMouse;

        // --- Raymarching Constants ---
        const int MARCH_STEPS = 90;
        const float MAX_DIST = 100.0;
        const float MIN_DIST = 0.001;

        // --- Fractal Parameters ---
        const float FRACTAL_SCALE = -2.3;
        const float MIN_RADIUS2 = 0.6;
        const float FIXED_RADIUS2 = 1.0;
        const int FRACTAL_ITERATIONS = 8;
        
        // --- Forward declarations for function ordering ---
        float distanceEstimator(vec3 p);
        vec3 getNormal(vec3 p);
        float rayMarch(vec3 ro, vec3 rd, out float iterations);
        float softShadow(vec3 ro, vec3 rd, float k);
        vec3 getCameraRay(vec2 uv, vec3 ro, vec3 target);
        vec3 getCameraPos(float t);

        // --- SDF: The Fractal Geometry ---
        // This is a variation of the Mandelbox fractal, designed for smooth, organic structures.
        float distanceEstimator(vec3 p) {
            vec3 offset = p;
            float dr = 1.0;

            for (int i = 0; i < FRACTAL_ITERATIONS; i++) {
                // Box fold
                p = clamp(p, -1.0, 1.0) * 2.0 - p;

                // Sphere fold for organic curvature
                float r2 = dot(p, p);
                if (r2 < MIN_RADIUS2) {
                    float temp = FIXED_RADIUS2 / MIN_RADIUS2;
                    p *= temp;
                    dr *= temp;
                } else if (r2 < FIXED_RADIUS2) {
                    float temp = FIXED_RADIUS2 / r2;
                    p *= temp;
                    dr *= temp;
                }
                
                // Scale and translate (classic mandel-set step)
                p = p * FRACTAL_SCALE + offset;
                dr = dr * abs(FRACTAL_SCALE) + 1.0;
            }
            return length(p) / abs(dr);
        }

        // --- Normal Calculation using Tetrahedron Technique ---
        vec3 getNormal(vec3 p) {
            vec2 e = vec2(MIN_DIST, 0.0);
            return normalize(vec3(
                distanceEstimator(p + e.xyy) - distanceEstimator(p - e.xyy),
                distanceEstimator(p + e.yxy) - distanceEstimator(p - e.yxy),
                distanceEstimator(p + e.yyx) - distanceEstimator(p - e.yyx)
            ));
        }

        // --- Core Raymarching Algorithm ---
        float rayMarch(vec3 ro, vec3 rd, out float iterations) {
            float t = 0.0;
            iterations = 0.0;
            for (int i = 0; i < MARCH_STEPS; i++) {
                vec3 p = ro + rd * t;
                float d = distanceEstimator(p);
                if (d < MIN_DIST || t > MAX_DIST) {
                    break;
                }
                t += d * 0.8; // Step slightly less than the distance for better accuracy
                iterations++;
            }
            return t;
        }
        
        // --- Soft Shadows for Depth ---
        float softShadow(vec3 ro, vec3 rd, float k) {
            float res = 1.0;
            float t = 0.01;
            for(int i=0; i<32; i++) {
                float h = distanceEstimator(ro + rd * t);
                if(h < MIN_DIST) return 0.0;
                res = min(res, k * h / t);
                t += clamp(h, 0.01, 2.0);
            }
            return res;
        }

        // --- Camera System ---
        vec3 getCameraRay(vec2 uv, vec3 ro, vec3 target) {
            vec3 fwd = normalize(target - ro);
            vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
            vec3 up = normalize(cross(fwd, right));
            return normalize(fwd + uv.x * right + uv.y * up);
        }

        vec3 getCameraPos(float t) {
            float angle1 = t * 0.05;
            float angle2 = t * 0.08;
            float angle3 = t * 0.03;
            vec3 p = vec3(
                cos(angle1) * sin(angle2),
                cos(angle3),
                sin(angle1) * sin(angle2)
            );
            return p * 4.5;
        }
        
        // --- Main Rendering Function ---
        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
            // Normalized, aspect-corrected screen coordinates
            vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;

            // --- Camera setup ---
            vec3 ro = getCameraPos(iTime); // Ray origin (camera position)
            vec3 target = vec3(0.0);

            // Subtle mouse influence on camera target
            if (iMouse.z > 0.0) { // Mouse has moved
                vec2 mouseNorm = (iMouse.xy / iResolution.xy - 0.5) * 2.0;
                target += vec3(mouseNorm.x, -mouseNorm.y, 0.0) * 0.5;
            }

            vec3 rd = getCameraRay(uv, ro, target); // Ray direction

            // --- Raymarch the scene ---
            float iterations;
            float t = rayMarch(ro, rd, iterations);

            // --- Shading and Coloring ---
            vec3 col = vec3(0.0); // Final color, starts at black

            if (t < MAX_DIST) {
                vec3 pos = ro + rd * t;
                vec3 normal = getNormal(pos);
                
                // Light setup
                vec3 lightPos = ro + vec3(0, 1, -1); // Light attached to camera for consistent lighting
                vec3 lightDir = normalize(lightPos - pos);

                // Ambient Occlusion based on raymarch iterations
                float ao = pow(clamp(1.0 - iterations / float(MARCH_STEPS), 0.0, 1.0), 1.5);
                
                // Diffuse lighting
                float dif = max(0.0, dot(normal, lightDir));

                // Soft shadows
                float shadow = softShadow(pos + normal * MIN_DIST * 2.0, lightDir, 16.0);
                dif *= shadow;
                
                // Final grayscale shading
                float shade = dif * 0.7 + ao * 0.3;
                col = vec3(shade);
                
                // Add a subtle glow to bright areas for a softer look
                col += pow(shade, 8.0) * 0.1;
            }
            
            // --- Fog ---
            // Exponential fog for depth and atmosphere
            float fog = 1.0 - exp(-t * t * 0.015);
            col = mix(col, vec3(0.0), fog);

            // --- Final Touches ---
            // Vignette to focus the view
            float vignette = 1.0 - smoothstep(0.8, 1.5, length(uv));
            col *= vignette;
            
            // Gamma correction
            col = pow(col, vec3(0.4545));

            fragColor = vec4(col, 1.0);
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }`;

        function compileShader(gl, source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                const info = gl.getShaderInfoLog(shader);
                console.error(`Error compiling shader: ${info}`);
                throw new Error('Shader compilation failed');
            }
            return shader;
        }

        const vertexShader = compileShader(gl, vertexShaderSource, gl.VERTEX_SHADER);
        const fragmentShader = compileShader(gl, fragmentShaderSource, gl.FRAGMENT_SHADER);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            const info = gl.getProgramInfoLog(program);
            console.error(`Error linking program: ${info}`);
            throw new Error('Program linking failed');
        }

        const positionAttributeLocation = gl.getAttribLocation(program, 'aPosition');
        const iResolutionLocation = gl.getUniformLocation(program, 'iResolution');
        const iTimeLocation = gl.getUniformLocation(program, 'iTime');
        const iMouseLocation = gl.getUniformLocation(program, 'iMouse');

        // WebGL2 requires a Vertex Array Object (VAO) to be bound.
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        const positions = [-1, -1, 1, -1, -1, 1, 1, 1];
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(positionAttributeLocation);
        gl.vertexAttribPointer(positionAttributeLocation, 2, gl.FLOAT, false, 0, 0);

        let mouseX = 0, mouseY = 0, mouseMoved = 0;
        let lastMouseTime = 0;
        
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            mouseMoved = 1.0;
            lastMouseTime = performance.now();
        }

        canvas.addEventListener('mousemove', handleMouseMove, false);
        canvas.addEventListener('touchmove', (e) => {
             e.preventDefault();
             handleMouseMove(e.touches[0]);
        }, false);


        function resizeCanvas() {
            const displayWidth = Math.min(1200, window.innerWidth);
            const displayHeight = displayWidth / (16 / 9);
            
            const devicePixelRatio = window.devicePixelRatio || 1;
            
            canvas.width = displayWidth * devicePixelRatio;
            canvas.height = displayHeight * devicePixelRatio;
            
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';

            if (gl) {
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let startTime = performance.now();
        function render() {
            const currentTime = (performance.now() - startTime) * 0.001 * 5.0; // 5x speed
            
            // Fade out mouse influence after a short period
            if (mouseMoved > 0.0 && (performance.now() - lastMouseTime) > 2000) {
                 mouseMoved = 0.0;
            }

            gl.useProgram(program);
            gl.bindVertexArray(vao);

            gl.uniform2f(iResolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(iTimeLocation, currentTime);
            gl.uniform4f(iMouseLocation, mouseX, canvas.height - mouseY, mouseMoved, 0);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
